packages:
  - apps/*
  - packages/*
  - scripts

catalog:
  # The docs examples type-check against @crustjs/effect, so both must resolve one copy.
  effect: 4.0.4
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0

overrides:
  # Vite plugins resolve the same Vite+ core that `vp build`/`vp test` run on.
  vite@*: "catalog:"

# Vite+ core has its own version, outside plugins' upstream `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Dependency install scripts stay blocked; these platform binaries resolve through optionalDependencies.
allowBuilds:
  esbuild: false
  workerd: false
