name: Setup
description: Install the Node.js, Bun, and pnpm that mise.toml and package.json pin, then the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Setup runtimes
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
