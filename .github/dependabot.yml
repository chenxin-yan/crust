version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Only `skills`: packages/skills/src/agents.generated.ts is generated from its agent registry.
  # The bump fails the generator's check in CI until the file is regenerated (the failure names the command).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: skills
