name: Type Performance

on:
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/config/**"
      - "packages/utils/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.shared.ts"
      - "scripts/type-perf-report*"
      - ".github/workflows/type-perf.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-performance:
    # Bot-created release PRs cannot use GITHUB_TOKEN to start this workflow.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: bun node pnpm

      - name: Measure PR merge
        run: |
          pnpm install --frozen-lockfile
          # build:task builds core's runtime dependency @crustjs/utils first.
          pnpm exec vp run --fail-if-no-match --filter @crustjs/core build:task
          bun scripts/type-perf-report.ts measure "$RUNNER_TEMP/head.json"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Measure base
        run: |
          cd base
          pnpm install --frozen-lockfile
          pnpm exec vp run --fail-if-no-match --filter @crustjs/core build:task
          cd ..
          # Use the PR merge's harness and compiler for both declaration sets.
          # The harness selects equivalent fixture syntax for the target's Context API.
          bun scripts/type-perf-report.ts measure "$RUNNER_TEMP/base.json" base

      - name: Write type performance report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          marker='<!-- type-perf-report -->'
          {
            echo "$marker"
            echo '## 🧠 Consumer type performance'
            echo
            echo "Base: $BASE_SHA · PR merge: $MERGE_SHA"
            echo
            bun scripts/type-perf-report.ts compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        id: report
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: type-performance-report-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/comment.md

  comment:
    needs: type-performance
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.type-performance.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Comment type performance
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- type-perf-report -->")))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$RUNNER_TEMP/comment.md"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md"
          fi
