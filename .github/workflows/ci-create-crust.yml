name: CI Create Crust

on:
  pull_request:
    paths:
      - "packages/config/**"
      - "packages/core/**"
      - "packages/create/**"
      - "packages/create-crust/**"
      - "packages/crust/**"
      - "packages/extensions/**"
      - "packages/man/**"
      - "packages/progress/**"
      - "packages/prompts/**"
      - "packages/style/**"
      - "packages/store/**"
      - "packages/utils/**"
      - "package.json"
      - "mise.toml"
      - "bun.lock"
      - "turbo.json"
      - "tsdown.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/ci-create-crust.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # Three runtime cases run sequentially; each may compile a binary and
    # `deno compile` downloads a denort runtime on a cold cache.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun ci

      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-create-crust-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-create-crust-${{ runner.os }}-

      - name: Build create-crust dependency subset
        run: bun turbo run build --filter=./packages/style --filter=./packages/prompts --filter=./packages/core --filter=./packages/extensions --filter=./packages/config --filter=./packages/man --filter=./packages/create --filter=./packages/crust --filter=./packages/create-crust

      - name: Print tool versions
        run: |
          node --version
          npm --version
          bun --version
          deno --version

      # Keep compatibility runtimes separate from the shared build toolchain.
      - name: Run create-crust smoke test
        run: mise exec node@22.23.2 deno@2.8.0 -- bun run --cwd packages/create-crust test:smoke
        env:
          CREATE_CRUST_SMOKE: "1"

      - name: Run installed-tool smoke test (Linux/npm)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        # npm 10.9.8 deletes the root bin when pruning incompatible optional platforms.
        # Keep the verified npm version local to this step; existing smoke keeps Node's npm.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/installed-tool-npm" --cache "$RUNNER_TEMP/installed-tool-npm-cache" --ignore-scripts --no-audit --no-fund npm@11.19.1
          PATH="$RUNNER_TEMP/installed-tool-npm/bin:$PATH" bun test packages/create-crust/tests/installed-tools.smoke.test.ts
        env:
          CREATE_CRUST_INSTALLED_SMOKE: "1"

      - name: Upload installed-tool diagnostics on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: create-crust-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-installed-*/diagnostics/**
          if-no-files-found: ignore

      - name: Upload smoke workspace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: create-crust-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-smoke
          if-no-files-found: ignore

      # Cache save runs as a normal step (not a post-step) so a Windows
      # tar/zstd flake during compression is contained by continue-on-error
      # and cannot fail the job. The cache is purely a perf optimization.
      - name: Save Turbo cache
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-create-crust-${{ runner.os }}-${{ github.sha }}
