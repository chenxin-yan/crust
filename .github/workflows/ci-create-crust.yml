name: CI Create Crust

on:
  pull_request:
    paths:
      - "packages/config/**"
      - "packages/core/**"
      - "packages/create/**"
      - "packages/create-crust/**"
      - "packages/crust/**"
      - "packages/extensions/**"
      - "packages/progress/**"
      - "packages/prompts/**"
      - "packages/style/**"
      - "packages/store/**"
      - "packages/testing/**"
      - "packages/utils/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.shared.ts"
      - ".github/workflows/ci-create-crust.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # Four runtime/artifact cases run sequentially; binary cases compile.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:task builds each package's upstream workspace dependencies first.
      - name: Build create-crust dependency subset
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/create-crust build:task

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version
          bun --version

      # The smoke host below is Node 24.0.0; Node binaries compile with mise.toml's Node 26.
      - name: Select the toolchain Node for the Node binary scaffold
        shell: bash
        run: echo "CRUST_TEST_SEA_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      # Keep compatibility runtimes separate from the shared build toolchain.
      - name: Run create-crust smoke test
        run: mise exec node@24.0.0 -- pnpm --dir packages/create-crust run test:smoke
        env:
          CREATE_CRUST_SMOKE: "1"

      - name: Run installed-tool smoke test (Linux/npm)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        # npm 10.9.8 deletes the root bin when pruning incompatible optional platforms.
        # Keep the verified npm version local to this step; existing smoke keeps Node's npm.
        # The installed crust also builds a Node binary, which needs Node 26+ (tsdown 0.23),
        # and is reinstalled engine-strict under Node 24.0.0, outside tsdown's engines.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/installed-tool-npm" --cache "$RUNNER_TEMP/installed-tool-npm-cache" --ignore-scripts --no-audit --no-fund npm@11.19.1
          CRUST_TEST_LEGACY_NODE="$(mise exec node@24.0.0 -- node -p process.execPath)"
          export CRUST_TEST_LEGACY_NODE
          PATH="$RUNNER_TEMP/installed-tool-npm/bin:$PATH" pnpm --dir packages/create-crust exec vp test run tests/installed-tools.smoke.test.ts
        env:
          CREATE_CRUST_INSTALLED_SMOKE: "1"

      - name: Upload installed-tool diagnostics on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-crust-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-installed-*/diagnostics/**
          if-no-files-found: ignore

      - name: Upload smoke workspace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-crust-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-smoke
          if-no-files-found: ignore
