name: CI Create Crust

on:
  pull_request:
    paths:
      - "packages/config/**"
      - "packages/core/**"
      - "packages/create/**"
      - "packages/create-crust/**"
      - "packages/crust/**"
      - "packages/extensions/**"
      - "packages/man/**"
      - "packages/progress/**"
      - "packages/prompts/**"
      - "packages/style/**"
      - "packages/store/**"
      - "packages/utils/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.shared.ts"
      - "tsconfig*.json"
      - ".github/workflows/ci-create-crust.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # Three runtime cases run sequentially; each may compile a binary and
    # `deno compile` downloads a denort runtime on a cold cache.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:task builds each package's upstream workspace dependencies first.
      - name: Build create-crust dependency subset
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/create-crust build:task

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version
          bun --version
          deno --version

      # Keep compatibility runtimes separate from the shared build toolchain.
      - name: Run create-crust smoke test
        run: mise exec node@22.23.2 deno@2.8.0 -- pnpm --dir packages/create-crust run test:smoke
        env:
          CREATE_CRUST_SMOKE: "1"

      - name: Run installed-tool smoke test (Linux/npm)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        # npm 10.9.8 deletes the root bin when pruning incompatible optional platforms.
        # Keep the verified npm version local to this step; existing smoke keeps Node's npm.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/installed-tool-npm" --cache "$RUNNER_TEMP/installed-tool-npm-cache" --ignore-scripts --no-audit --no-fund npm@11.19.1
          PATH="$RUNNER_TEMP/installed-tool-npm/bin:$PATH" pnpm --dir packages/create-crust exec vp test run tests/installed-tools.smoke.test.ts
        env:
          CREATE_CRUST_INSTALLED_SMOKE: "1"

      - name: Upload installed-tool diagnostics on failure
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: create-crust-installed-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-installed-*/diagnostics/**
          if-no-files-found: ignore

      - name: Upload smoke workspace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: create-crust-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/create-crust-smoke
          if-no-files-found: ignore
