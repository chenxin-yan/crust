name: CI Tooling

on:
  pull_request:
    paths:
      - "**"
      - "!apps/**"
      - "!packages/**"
      # Tooling and script tsconfigs extend the shared package configuration.
      - "packages/config/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Also builds the workspace packages scripts import, which type-aware lint resolves.
      - name: Type-check tooling and scripts
        run: pnpm exec vp run --fail-if-no-match --filter ./scripts check:types:task

      - name: Lint and format check (tooling and repository files)
        run: |
          pnpm run lint . --ignore-pattern 'packages/**' --ignore-pattern 'apps/**'
          pnpm run format . '!packages/**' '!apps/**'
