name: CI Tooling

on:
  pull_request:
    paths:
      - "**"
      - "!apps/**"
      - "!packages/**"
      # Tooling and script tsconfigs extend the shared package configuration.
      - "packages/config/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (tooling and repository files)
        run: |
          pnpm run lint . --ignore-pattern 'packages/**' --ignore-pattern 'apps/**'
          pnpm run format . '!packages/**' '!apps/**'
