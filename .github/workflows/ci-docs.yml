name: CI Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "tools/**"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - ".github/workflows/ci-docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      # Vite runs under Node; the Twoslash transformers need typescript@7's sync API, which Bun cannot run
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (docs)
        run: pnpm exec vp run --fail-if-no-match --filter ./apps/docs check:types:task

      - name: Lint and format check (docs)
        run: |
          pnpm run lint apps/docs
          pnpm run format apps/docs

      - name: Test (docs)
        run: pnpm --dir apps/docs exec vp test run

      - name: Build (docs)
        run: pnpm run build:docs
