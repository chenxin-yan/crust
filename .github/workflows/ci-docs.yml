name: CI Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "tools/**"
      - "mise.toml"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsdown.config.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".github/workflows/ci-docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-docs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-docs-${{ runner.os }}-

      - name: Type check (docs)
        run: bun turbo run check:types --filter=./apps/docs

      - name: Lint and format check (docs)
        run: |
          bun run lint apps/docs
          bun run format apps/docs

      - name: Test (docs)
        run: bun run --cwd apps/docs test

      - name: Build (docs)
        run: bun run build:docs
