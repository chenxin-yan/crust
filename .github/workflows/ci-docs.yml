name: CI Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - ".github/workflows/ci-docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (docs)
        run: pnpm exec vp run --fail-if-no-match --filter ./apps/docs check:types:task

      - name: Lint and format check (docs)
        run: |
          pnpm run lint apps/docs
          pnpm run format apps/docs

      - name: Test (docs)
        run: pnpm --dir apps/docs exec vp test run

      - name: Build (docs)
        run: pnpm run build:docs
