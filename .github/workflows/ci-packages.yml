name: CI Packages

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-packages-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-packages-${{ runner.os }}-

      - name: Build, type check, and test (packages)
        run: bun turbo run build check:types test --filter='./packages/*'

      - name: Lint and format check (packages)
        run: |
          bun run lint packages
          bun run format packages

      - name: Run package-manager smoke tests
        run: |
          npm install --global pnpm@10
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" bun test ./packages/crust/tests/package-manager.smoke.test.ts
          done
