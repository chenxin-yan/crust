name: CI Packages

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  node-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-node-smoke-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-node-smoke-${{ runner.os }}-
            turbo-packages-${{ runner.os }}-

      - name: Build packages
        run: bun turbo run build --filter='./packages/*'

      - name: Smoke built distributions with Node
        run: node scripts/smoke-runtimes/smoke.mjs

  deno-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-deno-smoke-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-deno-smoke-${{ runner.os }}-
            turbo-packages-${{ runner.os }}-

      - name: Build packages
        run: bun turbo run build --filter='./packages/*'

      - name: Smoke built distributions with Deno
        run: deno run --allow-env --allow-read --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Deno on PATH lets the deno-compile integration test run instead of skip.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # tsdown's bin runs under Node (engines ^22.18 || >=24.11); don't rely
      # on the runner image's preinstalled Node.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-packages-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-packages-${{ runner.os }}-

      - name: Build, type check, and test
        run: |
          bun turbo run build check:types test --filter='./packages/*'
          bun test scripts

      - name: Portable-runtime guard (no Bun globals in portable packages)
        run: bun run check:portable

      - name: Lint and format check (packages)
        run: |
          bun run lint packages
          bun run format packages

      - name: Run package-manager smoke tests
        run: |
          npm install --global pnpm@10
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" bun test ./packages/crust/tests/package-manager.smoke.test.ts
          done
