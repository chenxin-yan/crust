name: CI Packages

on:
  workflow_call:
  pull_request:
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "mise.toml"
      - "bun.lock"
      - "turbo.json"
      - "tsdown.config.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: runtime-smoke-${{ matrix.runtime }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        include:
          - runtime: node
            smoke: mise exec node@22.0.0 -- node scripts/smoke-runtimes/smoke.mjs
          - runtime: deno
            smoke: mise exec deno@2.8.0 -- deno run --allow-env --allow-read --allow-write --allow-run --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs
          - runtime: bun
            smoke: mise exec bun@1.4.0 -- bun scripts/smoke-runtimes/smoke.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build on the shared toolchain, then test the exact consumer runtime floor.
      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ matrix.runtime }}-smoke-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.runtime }}-smoke-${{ runner.os }}-
            turbo-packages-${{ runner.os }}-

      - name: Build packages
        run: bun turbo run build --filter='./packages/*'

      - name: Smoke built distributions with ${{ matrix.runtime }}
        run: ${{ matrix.smoke }}

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Deno is installed so integration tests run instead of skipping.
      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-packages-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-packages-${{ runner.os }}-

      - name: Build, type check, and test
        run: |
          bun run check:types
          bun run test

      - name: Lint and format check (packages)
        run: |
          bun run lint packages
          bun run format packages

      - name: Run package-manager smoke tests
        run: |
          npm install --global pnpm@10
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" bun test ./packages/crust/tests/package-manager.smoke.test.ts
          done
