name: CI Packages

on:
  workflow_call:
  pull_request:
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: runtime-smoke-${{ matrix.runtime }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        include:
          - runtime: node
            smoke: mise exec node@22.0.0 -- node scripts/smoke-runtimes/smoke.mjs
          - runtime: deno
            smoke: mise exec deno@2.8.0 -- deno run --allow-env --allow-read --allow-write --allow-run --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs
          - runtime: bun
            smoke: mise exec bun@1.4.0 -- bun scripts/smoke-runtimes/smoke.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build on the shared toolchain, then test the exact consumer runtime floor.
      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:pkgs

      - name: Smoke built distributions with ${{ matrix.runtime }}
        run: ${{ matrix.smoke }}

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Deno is installed so integration tests run instead of skipping.
      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, type check, and test
        run: |
          pnpm run check:types
          pnpm run test

      - name: Lint and format check (packages)
        run: |
          pnpm run lint packages
          pnpm run format packages

      - name: Run package-manager smoke tests
        run: |
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" pnpm --dir packages/crust exec vp test run tests/package-manager.smoke.test.ts
          done
