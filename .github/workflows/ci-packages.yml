name: CI Packages

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - runtime: node
            smoke: node scripts/smoke-runtimes/smoke.mjs
          - runtime: deno
            smoke: deno run --allow-env --allow-read --allow-write --allow-run --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs
          # Same assertions under Bun exercise the globalThis.Bun fast paths
          # (e.g. Bun.stringWidth), so native/fallback drift fails the matrix.
          - runtime: bun
            smoke: bun scripts/smoke-runtimes/smoke.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          # Documented floor (runtimes.mdx claims Node 22+); smoke the floor, not latest.
          node-version: 22

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          # Documented floor (runtimes.mdx claims Deno 2.8+); smoke the floor, not latest.
          deno-version: v2.8.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # When Bun is the runtime under test, smoke the documented floor
          # (runtimes.mdx / engines claim Bun 1.3.14+), not latest.
          bun-version: ${{ matrix.runtime == 'bun' && '1.3.14' || 'latest' }}

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ matrix.runtime }}-smoke-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.runtime }}-smoke-${{ runner.os }}-
            turbo-packages-${{ runner.os }}-

      - name: Build packages
        run: bun turbo run build --filter='./packages/*'

      - name: Smoke built distributions with ${{ matrix.runtime }}
        run: ${{ matrix.smoke }}

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Installed so Deno-gated integration tests run instead of skipping.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # tsdown's bin runs under Node (engines ^22.18 || >=24.11); don't rely
      # on the runner image's preinstalled Node.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-packages-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-packages-${{ runner.os }}-

      - name: Build, type check, and test
        run: |
          bun turbo run build check:types test --filter='./packages/*'
          bun test scripts

      # Portable packages must not reference Bun APIs: typecheck (@types/bun),
      # lint, and bun test are all blind to them, and the runtime smoke only
      # exercises a slice of each package. Feature-detection via globalThis.Bun
      # (see stringWidth.ts) is the sanctioned escape hatch and doesn't match.
      - name: Portable-runtime guard (no Bun globals in portable packages)
        run: |
          ! git grep -l -e 'Bun\.' -e 'from "bun"' -e '"bun:' -- 'packages/*/src/*.ts*' ':!*.test.ts*' ':!packages/crust/*'

      - name: Lint and format check (packages)
        run: |
          bun run lint packages
          bun run format packages

      - name: Run package-manager smoke tests
        run: |
          npm install --global pnpm@10
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" bun test ./packages/crust/tests/package-manager.smoke.test.ts
          done
