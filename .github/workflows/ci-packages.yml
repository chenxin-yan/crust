name: CI Packages

on:
  workflow_call:
  pull_request:
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  library-runtime:
    name: Library runtime checks (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: library-runtime-${{ matrix.runtime }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        include:
          - runtime: node
            label: Node
            smoke: mise exec node@24.0.0 -- node scripts/smoke-runtimes/smoke.mjs
          - runtime: deno
            label: Deno
            smoke: mise exec deno@2.8.0 -- deno run --allow-env --allow-read --allow-write --allow-run --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs
          - runtime: bun
            label: Bun
            smoke: mise exec bun@1.4.0 -- bun scripts/smoke-runtimes/smoke.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build on the shared toolchain, then test the exact consumer runtime floor.
      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:pkgs

      - name: Smoke built libraries with ${{ matrix.runtime }}
        run: ${{ matrix.smoke }}

  artifact-acceptance:
    name: CLI distribution checks (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    concurrency:
      group: artifact-acceptance-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build crust and its workspace dependencies
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/crust pack:task

      # Library packaging checks consume Crust's staged distribution too.
      - name: Stage the build tool for packaging checks (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/crust build:task

      # The test host stays on Node 24; only the executable compiler needs 26.
      - name: Select Node 26 for Node binary builds
        shell: bash
        run: echo "CRUST_TEST_SEA_NODE=$(mise exec node@26.10.0 -- node -p process.execPath)" >> "$GITHUB_ENV"

      # Runtime-gated suites must not pass merely because a required tool is missing.
      - name: Print required tool versions
        shell: bash
        run: |
          node --version
          npm --version
          pnpm --version
          bun --version
          deno --version
          "$CRUST_TEST_SEA_NODE" --version

      - name: Test Windows process cleanup and command-shim arguments
        if: matrix.os == 'windows-latest'
        run: pnpm exec vp test run packages/utils/src/process.test.ts packages/crust/tests/bounded-process.test.ts

      - name: Test snapshot process-group lifetime (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm --dir packages/crust exec vp test run src/utils/build-helpers.test.ts -t "entry lifetime"

      # Linux owns the full build/distribution suite, including all six modes.
      # Other hosts repeat only portable acceptance, not hardcoded cross-target cases.
      - name: Test all build and distribution integrations (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --dir packages/crust exec vp test run tests

      - name: Build, pack, install, and run Node binaries
        if: matrix.os != 'ubuntu-latest'
        # Keep Windows' native shell: Git Bash shadows its ZIP-capable tar with GNU tar.
        run: pnpm --dir packages/crust exec vp test run tests/node-exe.integration.test.ts

      - name: Build, pack, install, and run a Bun runtime package
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --dir packages/crust exec vp test run tests/package.integration.test.ts -t "Bun runtime package"

      - name: Bundle, pack, serve, run, and install a Deno runtime package
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --dir packages/crust exec vp test run tests/package.integration.test.ts -t "Deno runtime package"

      - name: Build, install, and run a Node package, Bun binary, and Deno binary
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --dir packages/crust exec vp test run tests/host-artifacts.integration.test.ts

      - name: Test packaged build markers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --dir packages/core exec vp test run tests/build-marker-bundle.test.ts tests/deno-packaged-bundle.test.ts

      # A Node 26 test host enables the real SEA case alongside Bun/Deno source paths.
      - name: Test artifact paths across runtimes (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mise exec node@26.10.0 -- pnpm --dir packages/utils exec vp test run tests/artifacts-runtimes.test.ts

      - name: Test application installs and compiler-backend delivery (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" pnpm --dir packages/crust exec vp test run tests/package-manager.smoke.test.ts tests/node-exe-delivery.smoke.test.ts
          done

  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: code-checks-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check:types

      # CLI distribution checks own Crust's tests/ and the compiled marker/path fixtures.
      # Keep the ordinary local `pnpm run test` unchanged: it still runs every suite.
      - name: Test library and tooling behavior
        run: >-
          pnpm exec vp run --filter './packages/*' --filter ./tools --filter ./scripts
          --filter '!@crustjs/crust' test:task
          --exclude '**/artifacts-runtimes.test.ts'
          --exclude '**/build-marker-bundle.test.ts'
          --exclude '**/deno-packaged-bundle.test.ts'

      - name: Test build-tool source behavior
        run: pnpm --dir packages/crust run test src

      - name: Lint and format check (packages)
        run: |
          pnpm run lint packages
          pnpm run format packages
