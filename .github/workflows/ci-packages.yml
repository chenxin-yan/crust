name: CI Packages

on:
  workflow_call:
  pull_request:
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - "tsconfig*.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: runtime-smoke-${{ matrix.runtime }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        include:
          - runtime: node
            smoke: mise exec node@22.0.0 -- node scripts/smoke-runtimes/smoke.mjs
          - runtime: deno
            smoke: mise exec deno@2.8.0 -- deno run --allow-env --allow-read --allow-write --allow-run --config scripts/smoke-runtimes/deno.json scripts/smoke-runtimes/smoke.mjs
          - runtime: bun
            smoke: mise exec bun@1.4.0 -- bun scripts/smoke-runtimes/smoke.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build on the shared toolchain, then test the exact consumer runtime floor.
      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:pkgs

      - name: Smoke built distributions with ${{ matrix.runtime }}
        run: ${{ matrix.smoke }}

  # Linux runs this test in `ci`; these runners cover native install shims
  # (npm's .cmd and Bun's .exe on Windows) and macOS.
  bun-runtime-package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: bun-runtime-package-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build crust and its workspace dependencies
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/crust pack:task

      # The test skips without bun or npm; fail here instead of passing on a skip.
      - name: Print tool versions
        run: |
          node --version
          npm --version
          bun --version

      - name: Build, pack, install, and run a Bun runtime package
        run: pnpm --dir packages/crust exec vp test run tests/package.integration.test.ts -t "Bun runtime package"

  # Node standalone binaries need a node that meets the bundled tsdown's
  # executable requirements (Node 26+ for tsdown 0.23). The shared toolchain
  # stays on Node 24; the tests receive Node 26 through CRUST_TEST_SEA_NODE and
  # fail rather than skip when it does not qualify.
  node-standalone-binary:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: node-standalone-binary-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build crust and its workspace dependencies
        run: pnpm exec vp run --fail-if-no-match --filter ./packages/crust pack:task

      - name: Select Node 26 for Node binary builds
        run: echo "CRUST_TEST_SEA_NODE=$(mise exec node@26.10.0 -- node -p process.execPath)" >> "$GITHUB_ENV"

      - name: Print tool versions
        run: |
          node --version
          npm --version
          bun --version
          "$CRUST_TEST_SEA_NODE" --version

      - name: Build, pack, install, and run Node binaries
        run: pnpm --dir packages/crust exec vp test run tests/node-exe.integration.test.ts

      # The real-SEA case only runs on Linux under a Node 25.5+ test host.
      - name: Resolve assets inside a Node SEA (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: mise exec node@26.10.0 -- pnpm --dir packages/utils exec vp test run tests/artifacts-runtimes.test.ts

      - name: Carry the Node binary backend through installed distributions (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" pnpm --dir packages/crust exec vp test run tests/node-exe-delivery.smoke.test.ts
          done

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-packages-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Deno is installed so integration tests run instead of skipping.
      - name: Setup runtimes
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, type check, and test
        run: |
          pnpm run check:types
          pnpm run test

      - name: Lint and format check (packages)
        run: |
          pnpm run lint packages
          pnpm run format packages

      - name: Run package-manager smoke tests
        run: |
          for package_manager in bun npm pnpm; do
            CRUST_SMOKE_PM="$package_manager" pnpm --dir packages/crust exec vp test run tests/package-manager.smoke.test.ts
          done
