name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "vite.shared.ts"
      - ".github/workflows/ci-packages.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Reset at the top; each job declares exactly what it needs. Only `publish`
# gets id-token: write (npm trusted publishing).
permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci-packages.yml
    permissions:
      contents: read

  select-mode:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      prNumber: ${{ steps.version.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version packages and update release PR
        id: version
        uses: changesets/action/version@v2
        with:
          pr-title: "chore: release packages"
          commit-message: "chore: version packages"
          script: pnpm run packages:version

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.tarballs.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build and lifecycle hooks run without publishing credentials or restored caches.
      - name: Build and pack packages
        run: |
          pnpm exec vp run --no-cache --fail-if-no-match --filter './packages/*' build:task
          pnpm run packages:pack "$RUNNER_TEMP/release-pack"

      - name: Upload release tarballs
        id: tarballs
        uses: actions/upload-artifact@v7
        with:
          name: release-pack-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-pack
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency installation, builds, or lifecycle hooks in this job.
      # npm >=11.5.1 uses OIDC; every root/platform package needs its own trusted
      # publisher for release.yml and a one-time initial publication on npmjs.com.
      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node
          cache: false

      - name: Download release tarballs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-pack

      - name: Publish packages
        # Call Bun directly: `pnpm run` installs missing dependencies, with lifecycle scripts, first.
        run: bun scripts/publish-packages.mjs --publish-dir "$RUNNER_TEMP/release-pack"

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.tags.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm
          cache: false

      - name: Install Changesets without lifecycle hooks
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Tag the full cohort even when a retry found every version already uploaded.
      - name: Create tags and GitHub releases
        id: tags
        uses: changesets/action/publish@v2
        with:
          script: pnpm run changeset git-tag

  release-pr-size:
    needs: version
    # Runs when changesets created/updated the release PR (not on publish).
    # This job posts the size comment because pull_request workflows on
    # GITHUB_TOKEN-created PRs never auto-run (recursive-trigger prevention).
    if: needs.version.outputs.prNumber != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: changeset-release/main
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Build and measure
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pkgs
          bun scripts/package-size-report.mjs sizes > "$RUNNER_TEMP/head.json"
          bun scripts/package-size-report.mjs sizes-published > "$RUNNER_TEMP/base.json"

      - name: Comment release size report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.version.outputs.prNumber }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- package-size-release-report -->'
          {
            echo "$marker"
            echo '## 📦 Package size since last release'
            echo
            echo 'Base = latest published versions on npm; head = this release.'
            echo
            bun scripts/package-size-report.mjs compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
          } > "$RUNNER_TEMP/comment.md"
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- package-size-release-report -->")))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$RUNNER_TEMP/comment.md"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md"
          fi

  deploy-docs:
    needs: finalize
    if: needs.finalize.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm run build:docs

      - name: Deploy docs to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
