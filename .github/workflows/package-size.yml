name: Package Size

on:
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "mise.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.shared.ts"
      - "scripts/package-size-report.mjs"
      - "scripts/package-size-fixtures/**"
      - ".github/workflows/package-size.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-size:
    # Release PRs get their own report (vs npm) from release.yml; runs here
    # would stall at action_required anyway (bot-created PR, GITHUB_TOKEN).
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup runtimes
        uses: jdx/mise-action@v4
        with:
          install_args: bun node pnpm

      - name: Build and measure head
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pkgs
          bun scripts/package-size-report.mjs sizes > "$RUNNER_TEMP/head.json"

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Build and measure base
        run: |
          cd base
          pnpm install --frozen-lockfile
          pnpm run build:pkgs
          cd ..
          # Head's script measures both trees so old base refs need no copy of it.
          bun scripts/package-size-report.mjs sizes base > "$RUNNER_TEMP/base.json"

      - name: Write package size report
        run: |
          marker='<!-- package-size-report -->'
          {
            echo "$marker"
            echo '## 📦 Package size'
            echo
            bun scripts/package-size-report.mjs compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        id: report
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: package-size-report-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/comment.md

  comment:
    needs: package-size
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package-size.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Comment package sizes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- package-size-report -->")))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$RUNNER_TEMP/comment.md"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md"
          fi
